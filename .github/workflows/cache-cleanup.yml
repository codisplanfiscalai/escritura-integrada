name: Retenção de caches Actions

on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Somente apresentar o plano, sem excluir caches'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: escritura-release-mutations
  queue: max
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Apresentar plano
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.ci.cleanup_actions --max-delete 100
      - name: Excluir somente caches elegíveis por ID
        if: github.event_name == 'schedule' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.ci.cleanup_actions --execute --max-delete 100
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cache-cleanup-report
          path: artifacts/cache-cleanup.json
          retention-days: 30
          overwrite: true
