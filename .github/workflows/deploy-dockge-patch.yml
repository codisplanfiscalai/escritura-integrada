name: Corrigir pacotes Dockge existentes
on:
  push:
    branches: [ops/dockge-release-patches]
    paths: [.github/dockge-release-plan.json]
permissions:
  contents: read
concurrency:
  group: escritura-release-mutations
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*dockge*patch.py' -v
      - name: Verificar fontes e equivalência Docker Compose
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL_COMMIT: ${{ github.sha }}
        run: python -m scripts.ci.publish_dockge_patch prepare --plan .github/dockge-release-plan.json --output dockge-supplements --tool-commit "$TOOL_COMMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dockge-supplements
          path: dockge-supplements
          if-no-files-found: error
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dockge-supplements
          path: dockge-supplements
      - name: Adicionar suplementos sem substituir arquivos anteriores
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL_COMMIT: ${{ github.sha }}
        run: python -m scripts.ci.publish_dockge_patch publish --plan .github/dockge-release-plan.json --output dockge-supplements --tool-commit "$TOOL_COMMIT"
