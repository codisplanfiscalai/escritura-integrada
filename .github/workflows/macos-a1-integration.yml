name: Integração A1 nativa macOS
on:
  pull_request:
    branches: [develop]
    paths:
      - 'native/**'
      - 'app/reception*.py'
      - 'scripts/build_native_a1.py'
      - 'scripts/build_macos.py'
      - 'tests/test_reception_native*.py'
      - '.github/workflows/macos-a1-integration.yml'
permissions:
  contents: read
concurrency:
  group: native-a1-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-a1:
    name: A1 integrado · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            docker/runtime.lock
            requirements-test.txt
      - name: Compilar e verificar helper de produção sem dependência PyCA
        run: python scripts/build_native_a1.py
      - name: Instalar runtime travado e dependências declaradas de teste
        run: |
          python -m scripts.ci.dependencies
          python -m pip install --only-binary=:all: --require-hashes -r docker/runtime.lock
          python -m pip install -c build/runtime-constraints.txt -r requirements-test.txt
          python -m pip check
      - name: Validar helper assinado, CNPJ, validade, políticas e API com TLS local
        run: |
          python -m unittest discover -s tests -p test_reception_native.py -v
          python -m unittest discover -s tests -p test_reception_native_macos.py -v
